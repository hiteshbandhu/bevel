name: Bug report
description: Something in a component or the docs doesn't work.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: annunciator
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, a code snippet, or a link to a reproduction.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, framework and versions
      placeholder: Chrome 140, Next.js 16, Tailwind 4.2
